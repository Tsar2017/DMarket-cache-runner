name: Refresh DMarkeT market cache

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: dmarket-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        unit_type:
          - Bachelor
          - 1 bedroom
          - 2 bedroom
          - 3 bedroom
          - 4 bedroom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh ${{ matrix.unit_type }} cache
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" python main.py "${{ matrix.unit_type }}"